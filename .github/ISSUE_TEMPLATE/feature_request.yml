name: Feature request
description: Suggest an improvement to Subdue
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: scope
    attributes:
      label: Platform scope
      options:
        - All platforms
        - macOS
        - Windows
        - Haiku
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this feature help you accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
